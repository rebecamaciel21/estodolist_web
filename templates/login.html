{% extends "base.html" %}
{% block title %}Login | EsToDoList{% endblock %}

{% block content %}
  <main class="max-w-sm mx-auto px-4 py-10">
    <form action="/login" method="post"
          class="bg-white rounded-xl shadow p-6 space-y-4">
      <h2 class="text-xl font-bold">Entre com suas credenciais</h2>

      {% if msgerro %}
        <p class="bg-red-100 text-red-700 rounded-lg px-3 py-2">{{ msgerro }}</p>
      {% endif %}

      <label for="email" class="block text-sm font-medium">E-mail</label>
      <input type="email" id="email" name="email" required
        class="w-full border rounded-lg px-3 py-3
               focus:outline-none focus:ring-2 focus:ring-indigo-400">

      <label for="senha" class="block text-sm font-medium">Senha</label>
      <input type="password" id="senha" name="senha" required
        class="w-full border rounded-lg px-3 py-3
               focus:outline-none focus:ring-2 focus:ring-indigo-400">

      <button type="submit"
        class="w-full bg-indigo-600 text-white rounded-lg
               px-4 py-3 font-semibold hover:bg-indigo-700">
        Entrar
      </button>
    </form>
  </main>
{% endblock %}
